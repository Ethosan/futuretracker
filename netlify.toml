[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Custom domain (planned): futuretracker.ethantam.dev. Once it is the primary
# domain in Netlify, the .netlify.app address redirects to it automatically.
# Steps are in the README under "Moving to futuretracker.ethantam.dev".

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Google sign-in opens a pop-up that has to talk back to this page.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Only these hosts can run code or receive data. script.google.com and
    # script.googleusercontent.com are the Apps Script (JSONP) option;
    # accounts.google.com is Google sign-in; googleapis.com is Sheets and Drive.
    # style 'unsafe-inline' covers style="" attributes (bar widths, heatmap colours).
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://script.google.com https://script.googleusercontent.com; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://accounts.google.com/gsi/ https://api.imgbb.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
